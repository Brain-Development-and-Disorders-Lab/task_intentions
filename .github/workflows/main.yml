name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Install dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm test
